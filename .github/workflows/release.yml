# 태그(v*)를 밀면 세 플랫폼의 실행 파일과 설치 파일을 만들어 릴리스에 올립니다.
#
#   git tag v0.2.3 && git push origin v0.2.3
#
# 산출물
#   meritz-open-api-darwin-arm64.mcpb   Apple Silicon Mac 용 Claude Desktop 설치 파일
#   meritz-open-api-darwin-x64.mcpb     Intel Mac 용
#   meritz-open-api-win32-x64.mcpb      Windows 용
#   meritz-mcp-darwin-arm64 / meritz-mcp-darwin-x64 / meritz-mcp-win32-x64.exe
#                                       실행 파일만 (Claude Code·Cursor·VS Code·Codex·Gemini CLI 용)
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  binary:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14,       plat: darwin-arm64, exe: meritz-mcp }
          - { os: macos-15-intel, plat: darwin-x64,   exe: meritz-mcp }
          - { os: windows-latest, plat: win32-x64,    exe: meritz-mcp.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - name: 실행 파일 빌드
        shell: bash
        run: ./build_binary.sh
      - name: 설치 파일(.mcpb) 묶기
        shell: bash
        run: python3 make_bundle.py ${{ matrix.plat }}
      - name: 오픈소스 고지를 산출물에 함께 둔다
        shell: bash
        # 실행 파일만 내려받는 이용자는 .mcpb 안의 고지를 보지 못한다.
        # MIT·BSD·ISC 의 저작권 표시 동봉 조건은 배포 경로마다 지켜야 한다.
        # 플랫폼마다 번들되는 구성요소가 달라 파일도 플랫폼마다 따로 올린다.
        run: cp THIRD-PARTY-NOTICES.txt dist/THIRD-PARTY-NOTICES-${{ matrix.plat }}.txt

      - name: 실행 파일 이름에 플랫폼 붙이기
        shell: bash
        run: |
          case "${{ matrix.plat }}" in
            win32-x64) cp bin/meritz-mcp.exe dist/meritz-mcp-win32-x64.exe ;;
            *)         cp bin/meritz-mcp dist/meritz-mcp-${{ matrix.plat }} ;;
          esac
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.plat }}
          path: |
            dist/*.mcpb
            dist/meritz-mcp-*
            dist/THIRD-PARTY-NOTICES-*.txt
          if-no-files-found: error

  release:
    needs: [binary]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v8
        with: { path: out, merge-multiple: true }
      - name: 체크섬
        run: cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: out/*
          generate_release_notes: true
