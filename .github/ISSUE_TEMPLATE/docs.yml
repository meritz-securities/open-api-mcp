name: 도구 설명·문서가 실제와 다릅니다
description: 도구가 알려 주는 파라미터·응답 설명이나 README 의 내용이 실제와 어긋나는 곳을 알려 주십시오.
labels:
- documentation
body:
- type: markdown
  attributes:
    value: |
      이 서버는 `api_type='describe'` 로 파라미터와 응답 필드 설명을 돌려드립니다.
      그 설명이나 README 의 내용이 실제 응답과 다르다면 알려 주십시오.

      API 응답 처리나 문서 설명에 보완이 필요한 내용을 확인하고 있습니다.

      **앱키·시크릿·접근토큰·계좌번호는 넣지 말아 주십시오.**
- type: dropdown
  id: kind
  attributes:
    label: 어떤 종류의 차이입니까
    options:
    - describe 가 알려 준 파라미터·필드 설명이 부족하거나 다릅니다
    - README 의 설명이 실제 동작과 다릅니다
    - 설치 안내대로 했는데 되지 않았습니다
    - 설명이 없어서 알기 어려웠습니다
    - 오탈자·깨진 링크
  validations:
    required: true
- type: input
  id: location
  attributes:
    label: 어디입니까
    description: 도구 이름과 `api_type`, 또는 README 의 절 제목을 적어 주십시오.
    placeholder: meritz_account / api_type='describe' — holdings
  validations:
    required: true
- type: textarea
  id: documented
  attributes:
    label: 설명에는 이렇게 되어 있습니다
  validations:
    required: true
- type: textarea
  id: actual
  attributes:
    label: 실제로는 이렇습니다
    description: 확인하신 방법도 함께 적어 주시면 좋습니다. 응답을 옮기실 때 계좌 정보는 지워 주십시오.
  validations:
    required: true
- type: checkboxes
  id: checks
  attributes:
    label: 확인해 주십시오
    options:
    - label: 이 글에 앱키·시크릿·접근토큰·계좌번호를 넣지 않았습니다.
      required: true
    - label: 계좌·주문·체결에 관한 문의가 아니라, 이 저장소의 코드나 문서에 관한 것입니다.
      required: true
