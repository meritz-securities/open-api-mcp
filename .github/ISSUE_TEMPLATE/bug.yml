name: 서버가 동작하지 않습니다
description: MCP 서버를 붙여 쓰시다 생긴 문제를 알려 주십시오.
labels:
- bug
body:
- type: markdown
  attributes:
    value: |
      ## 붙여넣기 전에 한 번만 확인해 주십시오

      **앱키(App Key)·시크릿(App Secret)·접근토큰·계좌번호를 이 화면에 넣지 마십시오.**
      MCP 설정 파일에는 앱키가 그대로 적혀 있습니다. 설정을 옮기실 때 특히 주의해 주십시오.
      이슈는 누구나 볼 수 있고, 지우셔도 수정 이력에 남습니다.

      - 앱키·시크릿·접근토큰 → `***`
      - 계좌번호 → `***`
      - 도구 응답에 담긴 잔고·보유종목·주문번호 → 지우시거나 임의의 값으로 바꿔 주십시오

      이미 노출하셨다면 개발자 포털에서 **즉시 재발급**해 주십시오.

      ---

      주문이 나가지 않았다거나 잔고가 다르게 보이는 등 **계좌·거래에 관한 문의는
      이곳에서 처리해 드릴 수 없습니다.** 개발자 포털의 문의 채널을 이용해 주십시오.
- type: textarea
  id: what-happened
  attributes:
    label: 무슨 일이 있었습니까
    description: 에이전트에게 무엇을 요청하셨고, 기대와 달리 어떤 일이 벌어졌는지 적어 주십시오.
    placeholder: |
      "잔고 보여줘" 라고 했더니 도구가 오류를 돌려주고, 에이전트가 조회에 실패했다고 답합니다.
  validations:
    required: true
- type: textarea
  id: reproduce
  attributes:
    label: 재현 방법
    description: |
      저희가 그대로 따라 할 수 있도록 순서대로 적어 주십시오. 대화 내용을 옮기실 때 계좌 정보는 지워 주십시오.

      예를 들면 이런 식입니다 — Claude Desktop 에 설치 파일로 설치 → MERITZ_READ_ONLY 를 1 로 두고 시작 → "예수금 알려줘" 라고 요청 → 아래 오류가 돌아옵니다
    render: shell
  validations:
    required: true
- type: dropdown
  id: client
  attributes:
    label: 어느 클라이언트에 붙이셨습니까
    options:
    - Claude Desktop
    - Claude Code
    - Cursor
    - VS Code
    - Codex CLI
    - 그 밖의 MCP 클라이언트
  validations:
    required: true
- type: dropdown
  id: install
  attributes:
    label: 어떻게 설치하셨습니까
    options:
    - 설치 파일(.mcpb) 을 내려받아 더블클릭
    - uvx 로 실행 (claude mcp add / codex mcp add 등)
    - 설정 파일에 직접 적어 넣음
    - 저장소를 내려받아 직접 실행
  validations:
    required: false
- type: dropdown
  id: tool
  attributes:
    label: 어떤 도구에서 났습니까
    options:
    - meritz_account — 잔고·예수금·평가·거래내역
    - meritz_market — 국내주식 시세·호가·체결
    - meritz_overseas_market — 해외주식 시세·호가·체결
    - meritz_trading — 주문·정정·취소·주문내역
    - meritz_forex — 환율·환전
    - meritz_reference — 참조 정보
    - meritz_info — 서버·설정 정보
    - 도구를 부르기 전에 서버가 뜨지 않았습니다
  validations:
    required: true
- type: input
  id: api-type
  attributes:
    label: 호출한 api_type 또는 API 경로
    description: 도구에 넘긴 `api_type` 값을 적어 주십시오. 아시면 API 경로도 함께 적어 주시면 좋습니다.
    placeholder: api_type='holdings' (/accounts/v1/me/holdings)
  validations:
    required: false
- type: dropdown
  id: read-only
  attributes:
    label: MERITZ_READ_ONLY 값
    options:
    - 1 — 조회 전용 (기본값)
    - 0 — 주문·환전까지 열어 둠
    - 잘 모르겠습니다
  validations:
    required: true
- type: input
  id: version
  attributes:
    label: 서버 버전
    description: 설치 파일로 넣으셨다면 그 버전을, 저장소에서 실행하셨다면 커밋 해시를 적어 주십시오.
    placeholder: 0.3.0 / 1a2b3c4
  validations:
    required: true
- type: input
  id: python-version
  attributes:
    label: 파이썬 버전
    description: '`python --version` 결과입니다. 3.11 이상이 필요합니다.'
    placeholder: Python 3.11.9
  validations:
    required: false
- type: input
  id: os
  attributes:
    label: 운영체제
    placeholder: macOS 14.5 / Windows 11 / Ubuntu 22.04
  validations:
    required: false
- type: textarea
  id: response
  attributes:
    label: 응답 코드와 서버 로그
    description: '`rsp_cd` 와 메시지, 클라이언트가 남긴 MCP 로그를 넣어 주십시오. 자격증명과 계좌 정보는 반드시 지우고 넣어 주십시오.'
    render: shell
  validations:
    required: false
- type: checkboxes
  id: checks
  attributes:
    label: 확인해 주십시오
    options:
    - label: 이 글에 앱키·시크릿·접근토큰·계좌번호를 넣지 않았습니다. 설정 파일을 옮길 때도 지웠습니다.
      required: true
    - label: 붙여넣은 로그에서 잔고·보유종목·주문번호 등 계좌 정보를 지웠습니다.
      required: true
    - label: 계좌·주문·체결에 관한 문의가 아니라, 이 서버 소프트웨어에 관한 문제입니다.
      required: true
