[project]
name = "meritz-open-api-mcp"
version = "0.3.1"
description = "메리츠증권 Open API MCP 서버 (config 기반 API 노출)"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Meritz Securities Co., Ltd." }]
dependencies = [
    "fastmcp>=2.0.0",
    "requests>=2.31.0",
]


[project.scripts]
meritz-mcp = "meritz.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["meritz"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]   # 줄 길이는 line-length 로 본다
